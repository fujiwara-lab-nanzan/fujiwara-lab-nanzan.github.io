<!-- 
===================================================================
藤原研究室 ホームページ - 研究設備（equipments.html）
===================================================================
このファイルは「研究設備」ページのレイアウトと内容を定義しています。

【編集可能な主な箇所】
- 研究設備アイテム（画像と名前）の追加・編集・削除（51行目〜）

【設備の追加方法】
<div class="equipment-grid"> の中に、以下のブロックを追加してください。
  <figure class="equipment-item">
      <img src="画像のパス" width="画像の横幅" height="画像の高さ" loading="lazy" decoding="async" alt="設備名">
      <figcaption>設備名</figcaption>
  </figure>
※ width / height には画像の実際のピクセル数を入れてください。
   読み込み中に文字がずれる（レイアウトシフト）のを防ぐための指定です。
   写真の大きさはCSS側で揃えるので、この数値が表示サイズになるわけではありません。
===================================================================
-->
