<!-- 
===================================================================
藤原研究室 ホームページ - ギャラリー（gallery.html）
===================================================================
このファイルは「ギャラリー（写真館）」ページのレイアウトと内容を定義しています。

【編集可能な主な箇所】
- リングギャラリーに表示する画像の追加・変更

【画像の追加方法】
<div class="ring" id="ring"> の中に、以下のブロックを追加してください。
  <div class="ring-card" role="button" tabindex="0">
      <img src="画像のパス" width="画像の横幅" height="画像の高さ" alt="写真の説明">
  </div>
※ width / height には画像の実際のピクセル数を入れてください。
   写真の縦横比どおりに枠が作られるため、写真が切れることはありません。
   表示の大きさと配置（円周上の角度・奥行き）はJavaScriptが自動計算します。
※ 写真は円周上に均等な角度で並びます。枚数を増やすほどリングらしい見た目になります。

【操作方法】
- 何も操作しなければ自動で回転し続けます
- 写真をクリック／タップ → その写真が正面に来て停止（もう一度押すと自動回転に戻ります）
- 左右の矢印ボタン → 隣の写真が正面に来て停止
- 左右にドラッグ／スワイプ、横方向のホイール → 手動で回転（離すと近い写真に止まります）
===================================================================
-->

<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="subpage">

    -->

                <a href="contact.html">アクセス</a>
                <a href="links.html">リンク</a>
            </nav>
            <button id="mobile-menu-button" class="mobile-menu-button" aria-label="メニュー">
                <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
            </button>
        </div>

            <!--<a href="research.html">研究内容</a> -->
            <a href="members.html">メンバー</a>
            <a href="achievements.html">研究業績</a>
            <a href="gallery.html">ギャラリー</a>
            <a href="equipments.html">研究設備</a>
            <a href="contact.html">アクセス</a>
            <a href="links.html">リンク</a>

    <main>
        <section id="gallery" class="page-section">
            <div class="container">
                <h2 class="section-title"><span class="section-title-en">Gallery</span><span class="section-title-ja">ギャラリー</span></h2>
                <!--
                【3D 横回転リングギャラリー】
                写真は円周上に均等な角度で並び、Y軸まわりに自動回転します。
                写真の追加・削除は、下の <div class="ring"> の中の
                <div class="ring-card"> ブロックを増やす／減らすだけで対応できます。
                （角度・奥行き・大きさは script.js の initRingGallery() が自動計算します）
                -->
                <div class="ring-gallery" id="ring-gallery">
                    <div class="ring-stage">
                        <div class="ring" id="ring">
                            <div class="ring-card" role="button" tabindex="0">
                                <img src="img/gallery/20251219.jpg" width="1108" height="1477"
                                     alt="">
                            </div>
                            <div class="ring-card" role="button" tabindex="0">
                                <img src="img/gallery/M1members.jpg" width="1428" height="1071"
                                     alt="">
                            </div>
                            <div class="ring-card" role="button" tabindex="0">
                                <img src="img/gallery/thermoMano.jpg" width="3024" height="4032"
                                     alt="">
                            </div>
                            <div class="ring-card" role="button" tabindex="0">
                                <img src="img/news/IEEETOWERS感謝状.jpg"
                                     alt="">
                            </div>
                        </div>
                    </div>
                    <button type="button" class="ring-btn prev" aria-label="前の写真">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    </button>
                    <button type="button" class="ring-btn next" aria-label="次の写真">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    </button>
                </div>
            </div>
                
        </section>
